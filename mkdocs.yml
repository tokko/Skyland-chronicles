site_name: Skyland Chronicles
site_description: Codex, kanban, and rewrite log for the Skyland Chronicles trilogy.
site_url: https://tokko.github.io/skyland-chronicles/
repo_url: https://github.com/tokko/skyland-chronicles
repo_name: tokko/skyland-chronicles
docs_dir: .
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search

exclude_docs: |
  .git/
  .github/
  .claude/
  .canary-approved
  scripts/
  source/
  mkdocs.yml
  .gitignore
  site/
  README.md

nav:
  - Home: index.md
  - Status: STATUS.md
  - Operations Manual: CLAUDE.md
  - Codex:
      - Index: codex/INDEX.md
      - Format: codex/README.md
      - Voice profile: codex/voice/voice-profile.md
      - Polish targets: codex/voice/polish-targets.md
      - AI-isms: codex/style/ai-isms.md
      - Style rules: codex/style/rules.md
      - Timeline: codex/timeline/master.md
  - Beats:
      - Hard: codex/beats/hard.md
      - Soft: codex/beats/soft.md
      - How beats work: codex/beats/README.md
  - Books: books/
  - Kanban: kanban/README.md
